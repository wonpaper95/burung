<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>부릉 — 테슬라 엔진 사운드</title>
<meta name="theme-color" content="#070809">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#070809;--text:#f2f4f6;--dim:#7d858e;--faint:#3a3f45;--ghost:#1f2327;--line:#1c2024;--chip:#121518;--red:#ff3b30;--amber:#ffb020;--ok:#34c759}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:16px/1.35 Inter,system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;user-select:none;overflow-x:hidden}
body{display:flex;flex-direction:column;background:radial-gradient(120% 90% at 50% 38%,#111417 0%,#070809 62%)}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:var(--chip);border-radius:999px;min-height:48px;padding:0 18px;touch-action:manipulation}
button:active{transform:scale(.97)}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}

/* 상단 바 */
.bar{display:flex;align-items:center;gap:10px;padding:10px 16px 0;flex:none;flex-wrap:wrap}
#power{background:var(--red);border-color:var(--red);color:#fff;font-weight:600;min-width:132px}
#power.on{background:transparent;color:var(--red)}
#engBtn{display:flex;align-items:center;gap:8px;font-weight:500}
#engBtn small{color:var(--dim);font-weight:400}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;background:var(--chip);padding:3px}
.seg button{border:0;background:transparent;min-height:42px;color:var(--dim)}
.seg button[aria-pressed=true]{background:#24292e;color:var(--text)}
.spacer{flex:1}
.chip{display:flex;align-items:center;gap:8px;padding:0 14px;min-height:48px;border-radius:999px;border:1px solid var(--line);background:var(--chip);color:var(--dim);font-size:14px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--amber)}.dot.bad{background:var(--red)}

/* 계기판 */
.cockpit{flex:1;min-height:0;display:grid;grid-template-columns:minmax(180px,1fr) minmax(0,2.3fr) minmax(180px,1fr);grid-template-rows:minmax(0,1fr) auto;padding:4px 24px 14px}
.side{display:flex;flex-direction:column;justify-content:center;gap:18px;min-width:0}
.side.left{align-items:flex-start;padding-left:12px}
.side.right{align-items:center}
.label{color:var(--dim);font-size:14px;font-weight:500;letter-spacing:.02em}
.label small{font-size:11px;margin-left:6px;opacity:.8}
.gear{display:flex;align-items:center;gap:14px}
#gearNum{font-size:clamp(84px,13vh,150px);font-weight:200;line-height:.95}
#gearMode{font-size:clamp(22px,3vh,32px);font-weight:300;color:#c9cfd5;padding-left:12px;border-left:1px solid var(--faint)}
.center{display:flex;align-items:center;justify-content:center;min-width:0;min-height:0}
#tach{height:100%;max-height:100%;max-width:100%;aspect-ratio:1;display:block}
#gmeter{width:min(150px,100%);aspect-ratio:1;display:block}
#gVal{font-size:clamp(28px,4.4vh,40px);font-weight:300}
#gVal small{font-size:14px;color:var(--dim);margin-left:4px}
.act{display:flex;flex-direction:column;gap:10px;width:100%;max-width:240px}
.act button{border-radius:18px;font-weight:600;touch-action:none;min-height:64px}
#rev,#gas{min-height:96px;border-color:#5a1d1a;background:#1a0f0e;color:#ff8a80}
#rev.held,#gas.held{background:var(--red);color:#fff;border-color:var(--red)}
#brake.held{background:#30353a}
.act p{margin:0;color:var(--dim);font-size:12px;line-height:1.4}

/* 하단 지표 */
.metrics{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:36px;padding:14px 16px 4px;border-top:1px solid var(--line);
  background:linear-gradient(180deg,rgba(255,255,255,.025),transparent 70%);border-radius:18px 18px 0 0}
.metric .val{display:flex;align-items:baseline;gap:6px;margin:6px 0 10px}
.metric .val b{font-size:clamp(28px,4.6vh,40px);font-weight:300}
.metric .val span{color:var(--dim);font-size:14px}
.track{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.track i{display:block;height:100%;width:0;background:var(--red);transition:width .12s linear}
#tempBar i{background:var(--text)}
.stripes{display:grid;grid-template-columns:repeat(30,1fr);gap:3px;height:12px}
.stripes i{background:var(--line);transform:skewX(-20deg);border-radius:1px}
.stripes i.on{background:#e9edf1}
.therm{width:16px;height:22px;color:var(--dim)}

/* 창(엔진·설정) */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
.panel{width:min(980px,100%);max-height:100%;overflow:auto;background:#0e1013;border:1px solid var(--line);border-radius:22px;padding:18px 20px}
.panel header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.panel h2{margin:0;font-size:18px;font-weight:600}
.engines{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.engines button{border-radius:14px;text-align:left;padding:10px 14px;min-height:64px}
.engines button[aria-pressed=true]{border-color:var(--red);background:#1a0f0e}
.engines b{display:block;font-weight:500}.engines small{display:block;color:var(--dim);font-size:12px}
.row{display:flex;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid var(--line)}
.row label{width:110px;color:var(--dim);flex:none}
.row output{width:40px;text-align:right;flex:none}
input[type=range]{flex:1;min-width:0;accent-color:var(--red);height:36px}
.note{color:var(--dim);font-size:13px;margin:12px 0 0}.note a{color:var(--dim)}

@media (max-width:820px){
  html,body{height:auto}
  .cockpit{grid-template-columns:1fr 1fr;grid-template-rows:auto auto auto;gap:16px;padding:8px 14px}
  .center{grid-column:1/-1;order:-1}
  #tach{height:auto;width:100%}
  .metrics{gap:16px;grid-template-columns:1fr}
  .engines{grid-template-columns:repeat(2,minmax(0,1fr))}
}
</style>
</head>
<body>
<div class="bar">
  <button id="power">시동 걸기</button>
  <button id="engBtn" aria-haspopup="dialog"><span id="engName">-</span><small>엔진 바꾸기 ▾</small></button>
  <div class="seg" role="group" aria-label="모드">
    <button id="modeGps" aria-pressed="true">실제 주행</button>
    <button id="modeSim" aria-pressed="false">가상 주행</button>
  </div>
  <span class="spacer"></span>
  <span class="chip"><span id="gpsDot" class="dot"></span><span id="gpsText">GPS 대기</span></span>
  <button id="setBtn" aria-haspopup="dialog">설정</button>
</div>

<main class="cockpit">
  <section class="side left">
    <div>
      <div class="label">기어</div>
      <div class="gear"><span id="gearNum" class="num">P</span><span id="gearMode"></span></div>
    </div>
    <div class="act" id="gpsCtl">
      <button id="rev">정차 중 레브<br><small style="font-weight:400">누르고 있기</small></button>
      <p>달리면 GPS 속도에 맞춰 소리가 나요. '지금 떼면 팝콘'이 뜨면 페달을 떼 보세요.</p>
    </div>
    <div class="act" id="simCtl" hidden>
      <button id="gas">가속 페달</button>
      <button id="brake">브레이크</button>
      <p>주차 중 소리 시험용이에요.</p>
    </div>
  </section>

  <section class="center"><canvas id="tach" aria-label="회전계와 속도"></canvas></section>

  <section class="side right">
    <div class="label">G-포스<small>추정</small></div>
    <canvas id="gmeter" aria-label="G-포스"></canvas>
    <div id="gVal" class="num">+0.00<small>g</small></div>
  </section>

  <section class="metrics">
    <div class="metric">
      <div class="label">가속도<small>추정</small></div>
      <div class="val num"><b id="accVal">+0.00</b><span>m/s²</span></div>
      <div class="track" id="accBar"><i></i></div>
    </div>
    <div class="metric">
      <div class="label">부하</div>
      <div class="val num"><b id="loadVal">0</b><span>%</span></div>
      <div class="stripes" id="loadBar"></div>
    </div>
    <div class="metric">
      <div class="label">엔진 온도</div>
      <div class="val num"><svg class="therm" viewBox="0 0 16 22" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 3a2 2 0 0 1 4 0v10.2a4 4 0 1 1-4 0z"/><path d="M8 9v6"/><path d="M12 5h2M12 8h2"/></svg><b id="tempVal">40</b><span>°C</span></div>
      <div class="track" id="tempBar"><i></i></div>
    </div>
  </section>
</main>

<div class="sheet" id="engSheet" hidden role="dialog" aria-label="엔진 고르기">
  <div class="panel">
    <header><h2>엔진 고르기</h2><button data-close>닫기</button></header>
    <div class="engines" id="engines"></div>
  </div>
</div>

<div class="sheet" id="setSheet" hidden role="dialog" aria-label="설정">
  <div class="panel" style="width:min(560px,100%)">
    <header><h2>설정</h2><button data-close>닫기</button></header>
    <div class="row"><label for="vol">볼륨</label><input id="vol" type="range" min="0" max="100" value="70"><output id="volOut">70</output></div>
    <div class="row"><label for="sens">반응 민감도</label><input id="sens" type="range" min="1" max="10" value="5"><output id="sensOut">5</output></div>
    <div class="row"><label>배기 팝콘</label><span style="flex:1;color:var(--dim);font-size:14px">페달을 뗄 때 '타다닥'</span><button id="pops" aria-pressed="true">켜짐</button></div>
    <div class="row"><label>내 차</label><span style="color:var(--dim);font-size:14px">테슬라 모델 Y L (2026) · 340kW · 2,088kg 기준으로 맞춤</span></div>
    <p class="note">운전에 집중하세요. 소리는 실내 스피커로만 나와요. · <a href="mailto:dusdn2295@gmail.com?subject=%5B%EB%B6%80%EB%A6%89%5D%20%EB%B2%84%EA%B7%B8%C2%B7%EA%B0%9C%EC%84%A0%20%EC%A0%9C%EC%95%88">버그 신고·개선 제안</a></p>
  </div>
</div>

let lastT = performance.now();
function tick(){
  const now = performance.now(), dt = Math.min(0.1, (now - lastT)/1000); lastT = now;
  let v, a;
  if (prefs.mode === 'sim'){
    a = S.gas ? aMaxAt(S.v) * 0.85 : S.brake ? -7 : (S.v > 0 ? -0.7 - S.v*0.012 : 0);
    v = S.v = Math.max(0, S.v + a*dt);
  } else ({v, a} = gpsSpeed());
  const extra = prefs.mode === 'gps' ? Math.max(0, G.noise - 0.3) : 0, liftTh = 0.8 + extra*4, decTh = 0.45 + extra*1.5;   // 심하게 흔들리는 GPS(0.3 넘음)면 기준 올림
  const gps = prefs.mode === 'gps';
  const liftSeen = gps && G.aLift < -liftTh && G.aS < 0 && performance.now() - G.fixAt < 600;   // 최근 0.5초에 확 줄면 = 페달 뗌
  if (liftSeen) a = Math.min(a, G.aLift);   // 뗀 게 보이면 가속 소리도 바로 끊음
  S.v = v; S.a = a;
  S.gLon += (a/9.81 - S.gLon) * Math.min(1, dt*6);
  S.gLat += ((prefs.mode === 'sim' ? 0 : G.lat)/9.81 - S.gLat) * Math.min(1, dt*4);
  const aRef = aMaxAt(v) * (0.85 - prefs.sens*0.08);   // 이 속도에서 내 차 최대 가속의 몇 % 면 풀 부하인지 (민감도 5 = 45%)

  let load = prefs.mode === 'sim' && S.gas ? 1 : Math.sqrt(clamp(a / aRef, 0, 1));   // 제곱근: 살살 밟아도 소리가 반응
  S.decT = (a < -decTh || liftSeen) ? S.decT + dt : 0;
  S.ovOn = v > 2 && (S.ovOn ? (a < -0.2 || liftSeen) : (S.decT >= 0.2 || (liftSeen && G.aLift < -liftTh*1.25)));   // 확 줄면 바로   // 확실한 감속이 0.2초 이어지면 켜고, 조금 회복되면 끔(흔들림에 안 깜빡이게)
  let overrun = S.ovOn ? clamp(-a/1.8, 0.4, 1) : 0;
  if (v > 2 && !overrun) load = Math.max(load, 0.12 + Math.min(0.15, v/400));     // 정속 주행도 약간의 부하

  // 기어
  const rpmAt = (g) => E.redline * v / gearV[g];
  S.loadS += (load - S.loadS) * Math.min(1, dt/(load > S.loadS ? 0.25 : 0.8));   // 변속 판단용 부하: 밟을 땐 빨리, 뗄 땐 천천히
  const ls = S.loadS, up = E.redline * (0.32 + 0.63*Math.pow(ls, 2.5)), /* 살살 = 일찍 변속, 꾹 = 레드라인까지 */ down = Math.max(E.idle*1.5, E.redline * (0.22 + 0.25*ls));
  if (now - S.lastShift > 600){
    if (S.gear < E.gears-1 && rpmAt(S.gear) > (overrun ? E.redline*0.97 : up) && rpmAt(S.gear+1) > down*1.2){   /* 올린 뒤 바로 내릴 rpm이면 안 올림 */ /* 감속 중엔 기어 유지(엔진브레이크·팝콘) */ S.gear++; S.lastShift = now; S.shiftCut = E.shiftCutS || 0.13; if (E.shiftBang && prefs.pops && load > 0.6) S.node?.port.postMessage({bang:1}); }
    else if (S.gear > 0 && rpmAt(S.gear) < down && rpmAt(S.gear-1) < E.redline*0.88){ S.gear--; S.lastShift = now; if (overrun) overrun = 1; }
  }
  if (v < 0.5) S.gear = 0;
  let rpm = rpmAt(S.gear);
  if (S.gear === 0) rpm = Math.max(rpm, E.idle + load * (E.redline*0.38 - E.idle)); // 출발 클러치 슬립
  rpm = Math.max(rpm, E.idle);

  // 정차 중 레브
  if (v < 0.5 && prefs.mode === 'gps'){
    if (S.revHeld){ S.revRpm += (E.redline*0.92 - S.revRpm) * dt * 6; load = 1; overrun = 0; }
    else { const before = S.revRpm; S.revRpm = Math.max(E.idle, S.revRpm - E.redline*0.8*dt); if (before > E.idle*1.3){ overrun = 1; load = 0; } }
    rpm = Math.max(rpm, S.revRpm);
  } else S.revRpm = rpm;

  if (S.shiftCut > 0){ S.shiftCut -= dt; load *= 0.1; if (S.loadS > 0.6) overrun = Math.max(overrun, 0.7); }   // 세게 밟다 변속하는 순간만 팝
  if (rpm >= E.redline){ rpm = E.redline - Math.random()*E.redline*0.04; load *= 0.4; overrun = Math.max(overrun, 0.6); }   // 리미터

  // 터보 + 블로우오프
  const boostT = E.turbo ? load * clamp((rpm/E.redline - 0.25)/0.35, 0, 1) : 0;
  S.boost += (boostT - S.boost) * Math.min(1, dt*2.5);
  if (E.turbo && S.boost > 0.35 && load < 0.15 && S.prevLoad > 0.5){ S.node?.port.postMessage({bov:1}); S.boost *= 0.2; }
  S.prevLoad = load;

  S.rpm = rpm; S.load = load; S.overrun = overrun;
  S.temp += ((S.on ? 82 + 12*load : 40) - S.temp) * dt / (S.temp < 80 ? 20 : 45);   // 엔진 온도(예열 흉내)
  S.vShown += (v - S.vShown) * Math.min(1, dt*5);
  if (S.node && S.on){
    const P = S.node.parameters, t = S.ctx.currentTime;
    P.get('rpm').setTargetAtTime(rpm, t, 0.015);
    P.get('load').setTargetAtTime(load, t, 0.02);
    P.get('overrun').setTargetAtTime(overrun, t, 0.02);
    P.get('boost').setTargetAtTime(S.boost, t, 0.05);
    P.get('pops').setValueAtTime(prefs.pops ? 1 : 0, t);
  }
}
setInterval(tick, 33);


// ---------- 계기판 ----------
const cv = $('tach'), cx = cv.getContext('2d'), gv = $('gmeter'), gx = gv.getContext('2d');
const loadBar = $('loadBar'); loadBar.innerHTML = '<i></i>'.repeat(30); const stripes = [...loadBar.children];
const FONT = 'Inter, system-ui, sans-serif';
let shownRpm = 0;
function fit(c){ const dpr = window.devicePixelRatio || 1, w = Math.round(c.clientWidth*dpr), h = Math.round(c.clientHeight*dpr);
  if (c.width !== w || c.height !== h){ c.width = w; c.height = h; } return [w, h]; }
function drawTach(){
  const [s] = fit(cv), c = s/2, r = s*0.47;
  cx.clearRect(0, 0, s, s);
  const step = E.redline > 12000 ? 2000 : 1000, max = Math.ceil(E.redline/step) * step;
  shownRpm += ((S.on ? S.rpm : 0) - shownRpm) * 0.35;
  const A0 = Math.PI*0.75, SW = Math.PI*1.5, ang = (rpm) => A0 + SW * clamp(rpm/max, 0, 1);
  const pt = (a, rr) => [c + Math.cos(a)*rr, c + Math.sin(a)*rr];
  // 눈금: 지나온 곳은 밝게, 레드존은 빨갛게
  const minor = step/5;
  for (let k = 0; k <= max + 1; k += minor){
    const a = ang(k), major = k % step === 0, red = k >= E.redline - 1, lit = k <= shownRpm;
    cx.strokeStyle = red ? (lit ? '#ff3b30' : '#6b1f1b') : (lit ? '#f2f4f6' : '#3a3f45');
    cx.lineWidth = s * (major ? 0.007 : 0.0035);
    const [x1, y1] = pt(a, r*(major ? 0.86 : 0.9)), [x2, y2] = pt(a, r*0.965);
    cx.beginPath(); cx.moveTo(x1, y1); cx.lineTo(x2, y2); cx.stroke();
  }
  cx.textAlign = 'center'; cx.textBaseline = 'middle';
  cx.font = `300 ${s*0.045}px ${FONT}`;
  for (let k = 0; k <= max; k += step){ const [x, y] = pt(ang(k), r*0.76); cx.fillStyle = k >= E.redline ? '#ff6b61' : '#c9cfd5'; cx.fillText(k/1000, x, y); }
  // 바늘: 원 위를 가로지르는 빨간 막대
  { const a = ang(shownRpm), [x1, y1] = pt(a, r*0.83), [x2, y2] = pt(a, r*1.0);
    cx.save(); cx.shadowColor = '#ff3b30'; cx.shadowBlur = s*0.02; cx.strokeStyle = '#ff3b30'; cx.lineWidth = s*0.009; cx.lineCap = 'round';
    cx.beginPath(); cx.moveTo(x1, y1); cx.lineTo(x2, y2); cx.stroke(); cx.restore(); }
  // 변속 표시등
  const rf = S.on ? S.rpm / E.redline : 0, n = 12, lit = Math.round(clamp((rf - 0.6)/0.37, 0, 1) * n), limiter = rf > 0.97;
  const segW = s*0.026, gap = s*0.006, y0 = c - s*0.235, x0 = c - (n*segW + (n-1)*gap)/2;
  for (let i = 0; i < n; i++){
    const col = i < 5 ? '#34c759' : i < 9 ? '#ffd60a' : '#ff3b30';
    cx.fillStyle = limiter ? (Math.floor(performance.now()/90) % 2 ? '#ff3b30' : '#2a1513') : i < lit ? col : '#24282c';
    cx.beginPath(); cx.roundRect(x0 + i*(segW+gap), y0, segW, s*0.009, s*0.004); cx.fill();
  }
  // 속도: 앞자리 0은 흐리게
  const spd = String(Math.min(999, Math.round(S.vShown*3.6))), digits = spd.padStart(3, '0');
  cx.font = `200 ${s*0.215}px ${FONT}`; cx.textAlign = 'left';
  const w = [...digits].map(ch => cx.measureText(ch).width), tot = w.reduce((a, b) => a + b, 0);
  let x = c - tot/2;
  [...digits].forEach((ch, i) => { cx.fillStyle = i < 3 - spd.length ? '#1f2327' : '#f2f4f6'; cx.fillText(ch, x, c - s*0.04); x += w[i]; });
  cx.textAlign = 'center'; cx.fillStyle = '#7d858e'; cx.font = `400 ${s*0.03}px ${FONT}`; cx.fillText('km/h', c, c + s*0.085);
  // rpm 숫자
  const rpmTxt = Math.round(S.on ? S.rpm : 0).toLocaleString('en-US');
  cx.font = `300 ${s*0.05}px ${FONT}`; const rw = cx.measureText(rpmTxt).width;
  cx.fillStyle = '#e6e9ec'; cx.fillText(rpmTxt, c - s*0.025, c + s*0.175);
  cx.fillStyle = '#7d858e'; cx.font = `400 ${s*0.026}px ${FONT}`; cx.textAlign = 'left'; cx.fillText('rpm', c - s*0.025 + rw/2 + s*0.012, c + s*0.18); cx.textAlign = 'center';
  // 팝콘 신호: 높은 rpm으로 밟는 중 = 지금 떼면 팝콘, 떼서 터지는 중 = 팡! 팡!
  let cue = null;
  if (S.on && prefs.pops){
    if (S.overrun > 0 && rf > 0.18) cue = ['팡! 팡!', 1];
    else if (S.v > 3 && S.load > 0.45 && rf > 0.55) cue = [rf > 0.75 ? '지금 떼면 팝콘 많이!' : '지금 떼면 팝콘', 0.55 + 0.45*Math.abs(Math.sin(performance.now()/160))];
  }
  if (cue){ cx.globalAlpha = cue[1]; cx.fillStyle = '#ffb020'; cx.font = `600 ${s*0.048}px ${FONT}`; cx.fillText(cue[0], c, c + s*0.3); cx.globalAlpha = 1; }
}
function drawG(){
  const [s] = fit(gv), c = s/2, r = s*0.46;
  gx.clearRect(0, 0, s, s);
  gx.strokeStyle = '#2a2f34'; gx.lineWidth = s*0.012;
  [1, 0.62, 0.25].forEach(k => { gx.beginPath(); gx.arc(c, c, r*k, 0, Math.PI*2); gx.stroke(); });
  gx.setLineDash([s*0.02, s*0.03]); gx.lineWidth = s*0.006; gx.beginPath();
  gx.moveTo(c - r, c); gx.lineTo(c + r, c); gx.moveTo(c, c - r); gx.lineTo(c, c + r); gx.stroke(); gx.setLineDash([]);
  const gl = clamp(S.gLon, -1, 1), gt = clamp(S.gLat, -1, 1), x = c + gt*r, y = c - gl*r;
  gx.strokeStyle = '#ff3b30'; gx.lineWidth = s*0.01; gx.beginPath(); gx.moveTo(c, c); gx.lineTo(x, y); gx.stroke();
  gx.save(); gx.shadowColor = '#ff3b30'; gx.shadowBlur = s*0.06; gx.fillStyle = '#ff3b30'; gx.beginPath(); gx.arc(x, y, s*0.03, 0, Math.PI*2); gx.fill(); gx.restore();
}
const sign = (v, d) => (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(d);
function draw(){
  drawTach(); drawG();
  $('gearNum').textContent = !S.on ? 'P' : S.vShown < 0.5 && S.gear === 0 ? 'N' : S.gear + 1;
  $('gearMode').textContent = S.on && !(S.vShown < 0.5 && S.gear === 0) ? 'D' : '';
  $('gVal').firstChild.nodeValue = sign(S.gLon, 2);
  $('accVal').textContent = sign(S.a, 2);
  $('accBar').firstChild.style.width = clamp(Math.abs(S.a)/7*100, 0, 100) + '%';
  const ld = S.on ? Math.round(S.load*100) : 0; $('loadVal').textContent = ld;
  const on = Math.round(ld/100*30); stripes.forEach((el, i) => el.classList.toggle('on', i < on));
  $('tempVal').textContent = Math.round(S.temp);
  $('tempBar').firstChild.style.width = clamp((S.temp - 40)/80*100, 0, 100) + '%';
  const st = prefs.mode === 'sim' ? ['ok', '가상 주행'] :
    G.state === 'ok' ? [(performance.now() - G.fixAt) < 4000 ? 'ok' : 'warn', `GPS 연결 · ±${Math.round(G.acc || 0)}m`] :
    G.state === 'denied' ? ['bad', '위치 권한 거부됨'] : G.state === 'none' ? ['bad', 'GPS 미지원'] :
    S.on ? ['warn', 'GPS 찾는 중'] : ['', 'GPS 대기'];
  $('gpsDot').className = 'dot ' + st[0]; $('gpsText').textContent = st[1];
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

// ---------- UI ----------
function renderEngines(){
  $('engines').innerHTML = Object.entries(ENGINES).map(([id, e]) =>
    `<button data-id="${id}" aria-pressed="${id === prefs.engine}"><b>${e.name}</b><small>${e.sub}</small></button>`).join('');
  $('engName').textContent = E.name;
}
const openSheet = (id) => { $(id).hidden = false; };
document.querySelectorAll('.sheet').forEach(sh => sh.addEventListener('click', (ev) => {
  if (ev.target === sh || ev.target.closest('[data-close]')) sh.hidden = true; }));
$('engBtn').onclick = () => openSheet('engSheet');
$('setBtn').onclick = () => openSheet('setSheet');
$('engines').addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
  prefs.engine = b.dataset.id; E = ENGINES[prefs.engine]; setupGears(); S.revRpm = E.idle; store.set(prefs);
  S.node?.port.postMessage({def:E}); renderEngines(); $('engSheet').hidden = true;
});
function setMode(m){ prefs.mode = m; store.set(prefs);
  $('modeGps').setAttribute('aria-pressed', m === 'gps'); $('modeSim').setAttribute('aria-pressed', m === 'sim');
  $('gpsCtl').hidden = m !== 'gps'; $('simCtl').hidden = m !== 'sim'; S.v = 0;
  if (m === 'gps' && S.on) startGps(); }
$('modeGps').onclick = () => setMode('gps');
$('modeSim').onclick = () => setMode('sim');
$('power').onclick = async () => {
  S.on = !S.on;
  $('power').textContent = S.on ? '시동 끄기' : '시동 걸기'; $('power').classList.toggle('on', S.on);
  if (S.on){
    await startAudio(); if (prefs.mode === 'gps') startGps();
    try { S.wake = await navigator.wakeLock?.request('screen'); } catch {}
  } else applyVolume();
};
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.on) S.ctx?.resume(); });
function hold(id, key){ const b = $(id);
  const on = (e) => { e.preventDefault(); S[key] = true; b.classList.add('held'); };
  const off = () => { S[key] = false; b.classList.remove('held'); };
  b.addEventListener('pointerdown', on); ['pointerup','pointercancel','pointerleave'].forEach(t => b.addEventListener(t, off)); }
hold('gas', 'gas'); hold('brake', 'brake'); hold('rev', 'revHeld');
const bindRange = (id, key) => { const el = $(id); el.value = prefs[key]; $(id+'Out').textContent = prefs[key];
  el.oninput = () => { prefs[key] = +el.value; $(id+'Out').textContent = el.value; store.set(prefs); applyVolume(); }; };
bindRange('vol', 'vol'); bindRange('sens', 'sens');
const popsBtn = $('pops');
const showPops = () => { popsBtn.setAttribute('aria-pressed', prefs.pops); popsBtn.textContent = prefs.pops ? '켜짐' : '꺼짐'; };
popsBtn.onclick = () => { prefs.pops = !prefs.pops; store.set(prefs); showPops(); };
showPops(); renderEngines(); setMode(prefs.mode);
</script>
</body>
